<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Job in BIH - Vaša veza sa poslodavcima</title>
    <!-- Fontovi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Source+Sans+3:wght@400;600;700&family=Amiri&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =====================================================
           CSS VARIJABLE (POTPUNO ISTI KAO U TVOM KODU)
           ===================================================== */
        :root {
            --color-primary:        #003366;
            --color-gold:           #FFD700;
            --color-blue-light:     #4FC3F7;
            --color-white:          #ffffff;
            --color-offwhite:       #f5f5f5;
            --color-light-gray:     #e0e0e0;
            --color-mid-gray:       #666666;
            --color-dark-gray:      #1a1a1a;
            --color-black:          #000000;
            
            --bg-primary:           var(--color-white);
            --bg-secondary:         var(--color-offwhite);
            --bg-overlay:           rgba(0, 0, 0, 0.05);
            --bg-footer:            rgba(0, 51, 102, 0.95);
            
            --text-primary:         var(--color-black);
            --text-secondary:       var(--color-mid-gray);
            --text-inverse:         var(--color-white);
            
            --accent-primary:       var(--color-primary);
            --accent-gold:          var(--color-gold);
            --accent-blue:          var(--color-blue-light);
            
            --shadow-color:         rgba(0, 0, 0, 0.1);
            --shadow-sm:            0 2px 5px var(--shadow-color);
            --shadow-md:            0 2px 10px var(--shadow-color);
            
            --header-h:             80px;
            --footer-h:             70px;
            
            --font-display:         'Oswald', sans-serif;
            --font-body:            'Source Sans 3', sans-serif;
            --font-arabic:          'Amiri', 'Traditional Arabic', serif;
            
            --transition-fast:      0.2s ease;
            --transition-base:      0.3s ease;
            
            --border-radius-sm:     4px;
            --border-radius-md:     5px;
            --border-radius-lg:     30px;
            --border-radius-full:   50%;
            --focus-outline:        2px solid var(--color-gold);
        }

    
        /* =====================================================
           RESET & OSNOVA
           ===================================================== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            height: 100%;
        }

        body {
            font-family: var(--font-body);
            overflow-x: hidden;
            color: var(--text-primary);
            background: var(--bg-primary);
            line-height: 1.6;
            transition: background-color var(--transition-base), 
                        color var(--transition-base);
            min-height: 100vh;
        }

        /* =====================================================
           PRINT STILOVI - SAMO TRENUTNA STRANICA
           ===================================================== */
        @media print {
            /* Sakrij header i footer */
            .site-header,
            .footer-nav,
            .language-bar,
            .no-print {
                display: none !important;
            }
            
            /* Prikaži samo aktivnu stranicu */
            .page {
                display: block !important;
                padding-top: 0 !important;
                padding-bottom: 0 !important;
                min-height: auto !important;
            }
            
            /* Sakrij sve neaktivne stranice */
            .page:not(.active-page) {
                display: none !important;
            }
            
            /* Osiguraj da se forma printa sa popunjenim podacima */
            input, textarea, select {
                border: 1px solid #ccc !important;
                background: white !important;
                color: black !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            /* Zadrži popunjene vrijednosti */
            .form-row {
                break-inside: avoid;
            }
            
            /* Hero slika neka se ne printa */
            .hero-image-side {
                display: none !important;
            }
            
            /* Prilagodi boje za print */
            .hero-text-side {
                background: #003366 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            .hero-gold-text {
                color: #FFD700 !important;
            }
            
            .hero-light-blue-text {
                color: #4FC3F7 !important;
            }
            
            /* Zastava za print */
            .flag-bg,
            .onama-background-flag {
                opacity: 0.1 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        /* =====================================================
           HEADER - SA SMANJENIM IKONICAMA ZA MOBITEL
           ===================================================== */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            min-height: var(--header-h);
            background: var(--bg-primary);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 10px 30px;
            z-index: 1000;
            box-shadow: var(--shadow-md);
            transition: background-color var(--transition-base);
            gap: 15px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .logo-slika {
    height: 60px;           /* Visina loga */
    width: auto;            /* Širina se automatski prilagođava */
    max-width: 200px;       /* Maksimalna širina */
    object-fit: contain;    /* Zadržava proporcije */
    border-radius: 4px;     /* Blago zaobljeni uglovi (opciono) */
    transition: opacity var(--transition-base);
}

        .logo-text {
            font-family: var(--font-display);
            font-size: clamp(1.2rem, 5vw, 1.6rem);
            font-weight: 700;
            color: var(--accent-primary);
            letter-spacing: 1px;
            border: 2px solid var(--accent-primary);
            padding: 6px 14px;
            border-radius: var(--border-radius-sm);
            user-select: none;
            transition: border-color var(--transition-base), 
                        color var(--transition-base);
            white-space: nowrap;
        }

        .page-indicator {
            margin-left: 15px;
            font-size: 1rem;
            color: var(--accent-gold);
            font-weight: 600;
            background: var(--accent-primary);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            white-space: nowrap;
        }

        /* JEZICI U PRVOM REDU */
        .header-lang-icons {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .lang-icon-header {
            width: 50px;
            height: 40px;
            background: var(--bg-secondary);
            border: 2px solid var(--accent-primary);
            border-radius: var(--border-radius-md);
            color: var(--accent-primary);
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color var(--transition-base), 
                        color var(--transition-base);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lang-icon-header:focus-visible {
            outline: var(--focus-outline);
            outline-offset: 2px;
        }

        .lang-icon-header:hover,
        .lang-icon-header.active {
            background: var(--accent-primary);
            color: var(--text-inverse);
            border-color: var(--accent-gold);
        }

        /* NAVIGACIJA – IKONE DESNO */
        .main-nav {
            display: flex;
            gap: clamp(10px, 2vw, 20px);
            flex-wrap: wrap;
            justify-content: flex-end;
            flex: 1;
        }

        .nav-icon {
            width: 50px;
            height: 50px;
            background: var(--bg-secondary);
            border-radius: var(--border-radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-primary);
            font-size: 1.2rem;
            text-decoration: none;
            transition: background-color var(--transition-base), 
                        color var(--transition-base),
                        transform var(--transition-fast);
            cursor: pointer;
            border: none;
            flex-shrink: 0;
        }

        .nav-icon:hover {
            transform: translateY(-3px);
        }

        .nav-icon:focus-visible {
            outline: var(--focus-outline);
            outline-offset: 2px;
        }

        .nav-icon:hover,
        .nav-icon:focus-visible,
        .nav-icon.active {
            background: var(--accent-primary);
            color: var(--text-inverse);
        }

        /* =====================================================
           SMANJENJE IKONICA ZA MOBITEL
           ===================================================== */
        @media (max-width: 768px) {
    .site-header {
        padding: 8px 12px;
        gap: 8px;
        flex-wrap: nowrap;
        overflow: hidden;
    }

    .logo-container {
        flex-shrink: 1;
        min-width: 0;
        overflow: hidden;
    }
    
    .logo-text {
        font-size: 1.1rem;
        padding: 4px 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
            /* Manji logo na mobitelima */
@media (max-width: 768px) {
    .logo-slika {
        height: 40px;
    }
}
            @media (max-width: 480px) {
    .logo-slika {
        height: 30px;
    }
}
    
    .page-indicator {
        display: none;
    }
    
    .lang-icon-header {
        width: 36px;
        height: 28px;
        font-size: 0.8rem;
        border-width: 1px;
    }
    
    .nav-icon {
        width: 32px;
        height: 32px;
        font-size: 0.9rem;
    }
    
    .main-nav {
        gap: 5px;
        flex-wrap: nowrap;
    }
}

@media (max-width: 480px) {
    .site-header {
        padding: 5px 8px;
        gap: 4px;
    }
    
    .logo-text {
        font-size: 0.95rem;
        padding: 3px 6px;
    }
    
    .lang-icon-header {
        width: 30px;
        height: 24px;
        font-size: 0.7rem;
    }
    
    .nav-icon {
        width: 28px;
        height: 28px;
        font-size: 0.8rem;
    }
}

@media (max-width: 360px) {
    .logo-text {
        font-size: 0.85rem;
    }
    
    .lang-icon-header {
        width: 26px;
        height: 22px;
        font-size: 0.6rem;
    }
    
    .nav-icon {
        width: 24px;
        height: 24px;
        font-size: 0.7rem;
    }
}

        /* =====================================================
           STRANICE
           ===================================================== */
        .page {
            display: none;
            min-height: 100vh;
            padding-top: var(--header-h);
            padding-bottom: var(--footer-h);
            width: 100%;
        }

        .page.active-page {
            display: block;
        }

        /* =====================================================
           STRANICA 0: HERO (POČETNA)
           ===================================================== */
        .hero-container {
    min-height: calc(100vh - var(--header-h) - var(--footer-h));
    display: flex;
    position: relative;
}

.hero-text-side {
    position: absolute;
    z-index: 2;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    clip-path: none;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding-left: 60px;
}

.hero-image-side {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('pocetna.jpeg');
    background-size: cover;
    background-position-x: center;
    background-position-y: 20%;
    z-index: 1;
}

.hero-text-content {
    color: white;
    max-width: 600px;
    padding: 40px;
    background: rgba(0, 51, 102, 0.75);
    border-radius: 12px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
}


        .hero-main-headline {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 0;
            text-transform: uppercase;
            font-family: 'Arial Black', Arial, sans-serif;
        }

        .hero-gold-text {
            color: #FFD700;
            display: block;
            margin-bottom: 5px;
        }

        .hero-light-blue-text {
            color: #4FC3F7;
            display: block;
        }

        /* =====================================================
           STRANICA 1: O NAMA
           ===================================================== */
        .onama-background-flag {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                #003399 0%,
                #003399 33.33%,
                #FFFFFF 33.33%,
                #FFFFFF 66.66%,
                #FFCC00 66.66%,
                #FFCC00 100%
            );
            z-index: -1;
            opacity: 0.25;
        }

        .onama-content {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .onama-text-container {
            max-width: 1000px;
            margin: 0 auto 40px;
            width: 100%;
        }

        .onama-text-container p {
            font-size: clamp(1rem, 2.2vw, 1.25rem);
            line-height: 1.7;
            margin-bottom: 25px;
            color: #000;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.72);
            padding: 6px 10px;
            border-radius: 4px;
            letter-spacing: 0.3px;
        }


        .onama-text-container p:last-child {
            font-weight: 800;
            font-size: clamp(1.2rem, 2.5vw, 1.5rem);
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #FFCC00;
        }

        /* =====================================================
           STRANICA 2: POSTUPAK, UVJETI I ZAKONSKI OKVIR
           ===================================================== */
        .procedure-section {
            position: relative;
            padding: 20px clamp(20px, 5vw, 30px) 40px;
            min-height: calc(100vh - var(--header-h) - var(--footer-h));
            overflow: hidden;
        }

        .flag-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                #003399 0%,       #003399 33.33%,
                #ffffff 33.33%,   #ffffff 66.66%,
                #FFCC00 66.66%,   #FFCC00 100%
            );
            opacity: 0.25;
            z-index: 0;
        }

        .section-content {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 6vw, 2.5rem);
            text-align: center;
            color: var(--accent-primary);
            margin-bottom: 30px;
            font-weight: 700;
            text-transform: uppercase;
            padding-bottom: 16px;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: var(--accent-gold);
            margin: 12px auto 0;
            border-radius: 2px;
        }

        .subsection-title {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 4vw, 1.8rem);
            color: var(--accent-primary);
            margin: 30px 0 15px 0;
            border-left: 5px solid var(--accent-gold);
            padding-left: 15px;
        }

        .procedure-list, 
        .conditions-list,
        .documents-list {
            list-style: none;
            margin-bottom: 25px;
        }

        .procedure-list li,
        .conditions-list li,
        .documents-list li {
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            line-height: 1.7;
            margin-bottom: 12px;
            padding-left: 25px;
            position: relative;
        }

        .procedure-list li::before,
        .conditions-list li::before,
        .documents-list li::before {
            content: '•';
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 1.5rem;
            position: absolute;
            left: 0;
            top: -5px;
        }

        .document-link {
            color: var(--accent-primary);
            text-decoration: none;
            border-bottom: 1px dashed var(--accent-gold);
        }

        .important-note {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid var(--accent-gold);
            border-radius: var(--border-radius-md);
            padding: 25px;
            margin: 30px 0;
        }

        .agency-address {
            background: var(--accent-primary);
            color: var(--text-inverse);
            padding: 15px 25px;
            border-radius: var(--border-radius-md);
            margin: 20px 0;
            font-weight: 600;
            text-align: center;
            border: 2px solid var(--accent-gold);
        }

        .section-tagline {
            font-size: clamp(1.1rem, 3vw, 1.3rem);
            text-align: center;
            color: var(--accent-primary);
            font-weight: 700;
            border-top: 3px solid var(--accent-gold);
            padding-top: 24px;
            margin-top: 40px;
        }

        /* PDF dugme za stranicu 2/5 - na DNU */
        .procedure-footer-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px dashed var(--accent-gold);
        }

        .procedure-pdf-btn {
            background: var(--bg-primary);
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 40px;
            cursor: pointer;
            display: inline-block;
            font-weight: 500;
            transition: all var(--transition-fast);
        }

        .procedure-pdf-btn:hover {
            background: var(--accent-primary);
            color: var(--text-inverse);
            transform: translateY(-2px);
        }

        /* =====================================================
           STRANICA 3: APLIKACIJA - ŽIVOTOPIS (SA PREVODOM PLACEHOLDERA)
           ===================================================== */
        .cv-container {
            background: var(--bg-secondary);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            padding: 35px 40px;
            border: 1px solid var(--color-light-gray);
            min-height: calc(100vh - var(--header-h) - var(--footer-h) - 40px);
            position: relative;
            margin: 20px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--accent-primary);
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 500;
            color: var(--accent-primary);
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        /* Fotografija i Lični podaci u istom redu */
        .personal-data-row {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .photo-column {
            flex: 0 0 150px;
        }

        .photo-upload {
            background: var(--bg-primary);
            border: 2px dashed var(--accent-gold);
            border-radius: 50%;
            width: 150px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .photo-upload:hover {
            border-color: var(--accent-primary);
            background: var(--bg-secondary);
        }

        .photo-upload i {
            font-size: 2.5rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        .photo-upload span {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .photo-upload input[type="file"] {
            display: none;
        }

        .photo-label {
            font-weight: 600;
            color: var(--accent-primary);
            margin-top: 10px;
            text-align: center;
        }

        .photo-label.required::after {
            content: " *";
            color: #c0392b;
            font-weight: bold;
        }

        .data-column {
            flex: 1;
            min-width: 300px;
        }

        .section {
            margin-bottom: 30px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            margin-bottom: 12px;
            border-bottom: 1px dashed var(--color-light-gray);
            padding: 8px 5px;
        }

        .form-label {
            flex: 0 0 220px;
            font-weight: 600;
            color: var(--accent-primary);
            padding-top: 8px;
            font-size: 0.98rem;
        }

        .form-label.required::after {
            content: " *";
            color: #c0392b;
            font-weight: bold;
        }

        .form-label.optional {
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-field {
            flex: 1 1 300px;
            min-width: 250px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 1rem;
            border: 1px solid var(--color-light-gray);
            border-radius: 8px;
            background: var(--bg-primary);
            transition: 0.15s;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
            color: var(--text-primary);
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--accent-primary);
            outline: none;
            background-color: var(--bg-secondary);
            box-shadow: 0 0 0 3px rgba(30,58,95,0.1);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            margin: 15px 0;
            padding: 5px 0;
        }

        .checkbox-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            flex: 0 0 20px;
            cursor: pointer;
        }

        .checkbox-row label {
            font-size: 1rem;
            color: var(--text-primary);
            cursor: pointer;
        }

        .checkbox-row.required label::after {
            content: " *";
            color: #c0392b;
            font-weight: bold;
        }

        .file-row {
            margin: 15px 0;
            padding: 10px 5px;
            background: var(--bg-secondary);
            border-radius: 8px;
        }

        .repeat-block {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px 20px 5px 20px;
            margin-top: 20px;
            border: 1px solid var(--color-light-gray);
        }

        .block-title {
            font-weight: 600;
            color: var(--accent-primary);
            margin-bottom: 10px;
            font-size: 1.05rem;
            border-left: 4px solid var(--accent-gold);
            padding-left: 10px;
        }

        .block-remove {
            text-align: right;
            margin-top: 5px;
        }

        .block-remove button {
            background: none;
            border: 1px solid var(--color-mid-gray);
            color: var(--text-secondary);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
        }
